<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Voice Emotion Tracker{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ede9fe 0%, #f3e8ff 100%);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .sidebar {
            min-height: 100vh;
            background: #fff;
            border-right: 1px solid #ede9fe;
            box-shadow: 2px 0 8px rgba(124, 58, 237, 0.04);
            transition: background 0.3s, color 0.3s;
        }
        .sidebar .nav-link {
            color: #6d28d9;
            font-weight: 500;
            font-size: 1.1rem;
            border-radius: 8px;
            margin-bottom: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .sidebar .nav-link.active, .sidebar .nav-link:hover {
            background: #ede9fe;
            color: #7c3aed;
        }
        .sidebar .nav-link i {
            margin-right: 8px;
        }
        .sidebar .navbar-brand {
            font-weight: 700;
            color: #7c3aed;
            font-size: 1.3rem;
            margin-bottom: 2rem;
        }
        .main-content {
            padding: 2.5rem 2rem 2rem 2rem;
            transition: background 0.3s, color 0.3s;
        }
        /* Dark mode styles */
        body.dark-mode {
            background: linear-gradient(135deg, #232946 0%, #181c2f 100%);
            color: #e0e7ff;
        }
        .dark-mode .sidebar {
            background: #232946;
            border-right: 1px solid #181c2f;
            box-shadow: 2px 0 8px rgba(30, 41, 59, 0.12);
        }
        .dark-mode .sidebar .nav-link {
            color: #a5b4fc;
        }
        .dark-mode .sidebar .nav-link.active, .dark-mode .sidebar .nav-link:hover {
            background: #181c2f;
            color: #facc15;
        }
        .dark-mode .sidebar .navbar-brand {
            color: #facc15;
        }
        .dark-mode .main-content {
            background: transparent;
            color: #e0e7ff;
        }
        .dark-mode .card, .dark-mode .card-body {
            background: #232946;
            color: #e0e7ff;
            border-color: #181c2f;
        }
        .dark-mode .table {
            color: #e0e7ff;
        }
        .dark-mode .btn-primary {
            background: #7c3aed;
            border-color: #a78bfa;
        }
        .dark-mode .btn-outline-secondary {
            color: #a5b4fc;
            border-color: #a5b4fc;
        }
        .dark-mode .btn-outline-secondary:hover {
            background: #a5b4fc;
            color: #232946;
        }
        .dark-mode .form-check-label {
            color: #e0e7ff;
        }
        .dark-mode .alert {
            background: #232946;
            color: #facc15;
        }
        @media (max-width: 768px) {
            .sidebar {
                min-height: auto;
                border-right: none;
                box-shadow: none;
            }
            .main-content {
                padding: 1.2rem 0.5rem;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar py-4 px-3 position-fixed">
            <a class="navbar-brand mb-4 d-block" href="/">🎤 Voice Dashboard</a>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="/">
                        <i class="bi bi-house"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'upload' %}active{% endif %}" href="/upload">
                        <i class="bi bi-upload"></i> Upload/Record
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'history' %}active{% endif %}" href="/history">
                        <i class="bi bi-clock-history"></i> History
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'analytics' %}active{% endif %}" href="/analytics">
                        <i class="bi bi-bar-chart"></i> Analytics
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'settings' %}active{% endif %}" href="/settings">
                        <i class="bi bi-gear"></i> Settings
                    </a>
                </li>
            </ul>
        </nav>
        <main class="col-md-9 ms-sm-auto col-lg-10 offset-md-3 offset-lg-2 main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Dark mode toggle logic
function setDarkMode(enabled) {
    if (enabled) {
        document.body.classList.add('dark-mode');
        localStorage.setItem('darkMode', 'true');
    } else {
        document.body.classList.remove('dark-mode');
        localStorage.setItem('darkMode', 'false');
    }
}
// On page load, apply dark mode if set
(function() {
    const dark = localStorage.getItem('darkMode');
    if (dark === 'true') {
        document.body.classList.add('dark-mode');
    }
    // Listen for toggle on settings page
    document.addEventListener('DOMContentLoaded', function() {
        const switchEl = document.getElementById('darkModeSwitch');
        if (switchEl) {
            switchEl.checked = document.body.classList.contains('dark-mode');
            switchEl.addEventListener('change', function() {
                setDarkMode(this.checked);
            });
        }
    });
})();
</script>
</body>
</html>
