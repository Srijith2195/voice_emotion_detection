{% extends 'base.html' %}
{% block title %}Settings | Voice Emotion Tracker{% endblock %}
{% block content %}
<h2 class="mb-4" style="color:#7c3aed;font-weight:600;">Settings</h2>
<div class="card shadow-sm mb-4">
    <div class="card-body">
        <h5>User Preferences</h5>
        <form>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                <label class="form-check-label" for="darkModeSwitch">Enable Dark Mode</label>
            </div>
            <button type="submit" class="btn btn-primary">Save Preferences</button>
        </form>
        <div class="text-muted mt-3">(More settings coming soon.)</div>
    </div>
</div>
{% endblock %}
